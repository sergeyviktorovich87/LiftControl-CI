<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Вход · Лифт Контроль</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef2ee;font:16px system-ui;color:#18372b}main{width:min(360px,80vw);padding:36px;background:white;border-radius:20px}label{display:block;margin:20px 0 8px}input,button{box-sizing:border-box;width:100%;padding:13px;border:1px solid #cbd8d0;border-radius:9px;font:inherit}button{margin-top:25px;background:#237451;color:white}p{color:#708377;font-size:14px}.error{color:#a53e3e}</style><main><h1>Лифт Контроль</h1><p>Войдите в рабочее пространство</p>{% if form.errors %}<p class="error">Проверьте логин и пароль.</p>{% endif %}<form method="post">{% csrf_token %}<label for="username">Логин</label><input id="username" name="username" autocomplete="username" required autofocus><label for="password">Пароль</label><input id="password" name="password" type="password" autocomplete="current-password" required><input type="hidden" name="next" value="{{ next }}"><button>Войти</button></form></main></html>
